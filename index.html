<!-- 🔥 AUTO REDIRECT AFTER 10 SECONDS -->
<script>

function getNextLink() {

  let url = window.location.href;

  let parts = url.split("?");

  if(parts.length > 1) {

    return decodeURIComponent(parts[1]);

  }

  return null;
}

let nextLink = getNextLink();

if(nextLink){

  setTimeout(function(){

    window.location.href = nextLink;

  }, 10000);

}
