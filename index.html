<!-- 🔥 SMARTLINK FIXED REDIRECT -->
<script>
function getSmartLink() {
  let url = window.location.href;
  let parts = url.split("?");
  
  if(parts.length > 1){
    return decodeURIComponent(parts[1]);
  }
  return null;
}

let nextLink = getSmartLink();

if(nextLink){
  setTimeout(function(){
    window.location.href = nextLink;
  }, 10000); // 10 sec delay
}
</script>
