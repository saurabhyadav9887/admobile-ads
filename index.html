<!-- 🔥 SAFE SMARTLINK REDIRECT -->
<script>
try {
  function getSmartLink(){
    let url = window.location.href;
    let parts = url.split("?");
    if(parts.length > 1){
      return decodeURIComponent(parts[1]);
    }
    return null;
  }

  var nextLink = getSmartLink();

  if(nextLink){
    setTimeout(function(){
      window.location.href = nextLink;
    }, 10000);
  }
} catch(e) {
  console.log("Smartlink error safe handled");
}
</script>
